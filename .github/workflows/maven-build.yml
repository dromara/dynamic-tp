name: Java CI with Maven

on:
  push:
    branches: [ "springboot3", "springboot4" ]
  pull_request:
    branches: [ "springboot3", "springboot4" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw -B package --file pom.xml -DskipThrift=true
